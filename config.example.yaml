# Kopieer dit bestand naar config.yaml en vul aan.
# config.yaml zelf wordt niet gecommit (zie .gitignore) omdat het een webhook-URL
# kan bevatten. Voor gebruik in GitHub Actions wordt de webhook-URL via het
# secret HOMEY_WEBHOOK_URL aangeleverd (zie README.md) en niet uit dit bestand gelezen.

stations:
  - name: "DATS24 Dilbeek"
    url: "https://dats24.be/nl/particulier/sdp/tankstation-dilbeek_118"
    # Enkel E10 (Euro95) opvolgen voor dit station. Leeg ([]) = alles wat gevonden wordt.
    fuels: [euro95]

  - name: "Shell Express Anderlecht"
    url: "https://carbu.com/belgie/index.php/station/shell-express/anderlecht/1070/2112"
    # Enkel E10 (Euro95) opvolgen voor dit station.
    fuels: [euro95]

  # Voeg hier extra tankstations toe:
  # - name: "Q8 Voorbeeld"
  #   url: "https://..."
  #   fuels: [diesel, euro95]

homey:
  # Volledige webhook-URL van je Homey "Webhook ontvangen" flow-trigger, bv.:
  # https://webhook.homey.app/<jouw-homey-id>/<event-naam>
  # Lokaal testen: vul hier in. In GitHub Actions: laat leeg, gebruik het secret HOMEY_WEBHOOK_URL.
  webhook_url: ""

storage:
  path: "data/prices.json"

# "Goedkoopste tankstation in de buurt" (tankprijzen/nearby_main.py) — apart van
# de prijswijzigingen-tracker hierboven, draait via een eigen GitHub Actions
# workflow (check-nearby.yml) en gebruikt een eigen Homey webhook-flow/apparaat.
nearby:
  fuel: euro95
  # Gemeente/postcode als centrum van de zoekopdracht (benadering van je adres:
  # Thiernessestraat 12, 1070 Brussel = Anderlecht). De afstand per station komt
  # van carbu.com en is de afstand tot dit centrum, niet tot je exacte adres.
  location_name: "Anderlecht"
  postcode: "1070"
  radius_km: 10
  excluded_municipalities:
    - "Ukkel"
    - "Sint-Jans-Molenbeek"
    - "Brussel"
  # Volledige webhook-URL van een aparte Homey "Webhook ontvangen" flow-trigger
  # voor dit doel. Lokaal testen: vul hier in. In GitHub Actions: laat leeg,
  # gebruik het secret HOMEY_NEARBY_WEBHOOK_URL.
  homey_webhook_url: ""
  storage_path: "data/nearby.json"
