name: Goedkoopste tankstation in de buurt

on:
  schedule:
    # 1x per dag om 06:00 UTC.
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: check-nearby
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Prepare config.yaml
        run: cp config.example.yaml config.yaml

      - name: Zoek goedkoopste tankstation in de buurt
        env:
          HOMEY_NEARBY_WEBHOOK_URL: ${{ secrets.HOMEY_NEARBY_WEBHOOK_URL }}
        run: python -m tankprijzen.nearby_main

      - name: Commit bijgewerkt resultaat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/nearby.json
          git diff --cached --quiet || git commit -m "Update goedkoopste tankstation in de buurt"
          git push
