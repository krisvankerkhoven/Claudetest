name: Deelkas naar GitHub Pages

# Publiceert enkel de map deelkas/ (de rest van de repo blijft buiten de site).
on:
  push:
    branches: [claude/tankstation-prijsupdates-homey-n6ytof]
    paths: ["deelkas/**", ".github/workflows/deelkas-pages.yml"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Alleen de app meenemen
        run: |
          mkdir _site
          cp deelkas/index.html deelkas/app.js deelkas/style.css deelkas/config.js _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
